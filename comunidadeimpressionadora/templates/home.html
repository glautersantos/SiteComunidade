{% extends 'base.html' %}

{% block body %}
    <div class="container mt-3">
        <h1 style="color: orange">Comunidade Impressionadora - Hashtag treinamentos</h1>
        <h2>Alunos, experts e a galera da Hashtag em um só lugar</h2>
        <hr>
        {% for post in posts %}
        <div class="row border mt-4 p-3 meupost">
            <div class="col col-2">
                <div class="image pe-2"> <img src="{{ url_for('static', filename='fotos_perfil/{}'.format(post.autor.foto_perfil)) }}" class="rounded" width="100"> </div>
                    <strong>{{ post.autor.username }}</strong>
                <!--<div class="row justify-content-center">

                    {% for curso in post.autor.cursos.split(';') %}
                        {% if curso: %}
                            <button type="button" class="btn btn-success mt-2" disabled>{{ curso }}</button>
                        {% endif %}
                    {% endfor %}
                </div>-->
            </div>
            <div class="col col-9">
                <H3>{{ post.titulo }}</H3>
                <p>{{ post.corpo }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
